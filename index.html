<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0B1118">
<title>JARVIS AI</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg">
<style>
:root {
  color-scheme: dark;
  --bg:#0B1118;
  --panel:#131D28;
  --line:#243445;
  --text:#E8EEF4;
  --muted:#8A9BAD;
  --accent:#4FC3F7;
}
* { box-sizing:border-box; }
body {
  margin:0; background:var(--bg); color:var(--text);
  font:16px/1.6 system-ui,sans-serif;
}
.app {
  max-width:850px; height:100dvh; margin:auto;
  padding:12px 16px; display:flex; flex-direction:column;
}
header {
  display:flex; align-items:center;
  justify-content:space-between; gap:10px;
}
h1 { font-size:25px; }
button,textarea { font:inherit; }
button {
  cursor:pointer; border:1px solid var(--line);
  border-radius:10px; padding:9px 13px;
  background:var(--panel); color:var(--text);
}
.modes { display:flex; gap:8px; overflow-x:auto; padding:8px 0; }
.modes button { flex:none; }
.modes .active {
  background:var(--accent); color:#062033;
}
#log { flex:1; overflow-y:auto; padding:12px 0; }
.msg {
  padding:12px 15px; border-radius:12px;
  margin-bottom:12px; overflow-wrap:anywhere;
  white-space:pre-wrap;
}
.user { background:#174761; margin-left:12%; }
.ai { background:var(--panel); border:1px solid var(--line); }
form { display:flex; gap:8px; padding:10px 0; }
textarea {
  min-width:0; flex:1; resize:vertical; min-height:48px;
  max-height:140px; padding:12px; border-radius:12px;
  border:1px solid var(--line); background:var(--panel);
  color:var(--text);
}
#send { background:var(--accent); color:#062033; font-weight:bold; }
.small { font-size:12px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>JARVIS AI</h1>
    <button id="newChat">New Chat</button>
  </header>

  <div class="modes" id="modes"></div>
  <div id="log" aria-live="polite">
    <div class="msg ai">Hello! I'm JARVIS. How can I help you?</div>
  </div>

  <form id="form">
    <textarea id="question" placeholder="Ask JARVIS anything..." required></textarea>
    <button id="send" type="submit">Send</button>
  </form>
  <div class="small">Personal AI Assistant · Made by Ritesh</div>
</div>

<script src="https://js.puter.com/v2/"></script>
<script>
const $ = id => document.getElementById(id);
const log = $("log");
const question = $("question");
const send = $("send");

const modes = {
  Chat: "You are JARVIS, a helpful personal AI assistant.",
  Maths: "You are a patient maths tutor. Explain solutions step by step.",
  Coding: "You are an expert programmer. Provide correct code and explain it.",
  Writing: "You are a professional writing assistant. Follow the requested tone.",
  Study: "You are a friendly tutor. Explain topics simply and quiz the learner.",
  Translate: "You are a translator. Translate into the language requested by the user.",
  Website: "You are a web developer. Generate complete, responsive HTML websites when requested."
};

let mode = "Chat";
let history = [];

function addMessage(text, role) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

function buildModes() {
  const box = $("modes");
  box.innerHTML = "";
  Object.keys(modes).forEach(name => {
    const button = document.createElement("button");
    button.textContent = name;
    button.className = name === mode ? "active" : "";
    button.onclick = () => {
      mode = name;
      buildModes();
      question.placeholder = "Ask JARVIS about " + mode + "...";
    };
    box.appendChild(button);
  });
}

$("form").addEventListener("submit", async event => {
  event.preventDefault();
  const text = question.value.trim();
  if (!text || send.disabled) return;

  addMessage(text, "user");
  history.push({ role: "user", content: text });
  question.value = "";
  send.disabled = true;
  send.textContent = "Thinking...";

  const reply = addMessage("JARVIS is thinking...", "ai");

  try {
    if (!window.puter || !puter.ai) {
      throw new Error("Puter.js could not load. Check your internet connection.");
    }

    const messages = [
      {
        role: "system",
        content: modes[mode] +
          " Be clear, useful and accurate. You are JARVIS."
      },
      ...history.slice(-20)
    ];

    const response = await puter.ai.chat(messages, {
      model: "anthropic/claude-sonnet-5-5"
    });

    const content = response?.message?.content;
    const answer = typeof content === "string"
      ? content
      : Array.isArray(content)
        ? content.filter(x => x.type === "text")
            .map(x => x.text || "").join("\n")
        : "";

    if (!answer) throw new Error("No response received from the AI.");

    reply.textContent = answer;
    history.push({ role: "assistant", content: answer });

  } catch (error) {
    reply.textContent = "Error: " + (error.message || "Please try again.");
  } finally {
    send.disabled = false;
    send.textContent = "Send";
    question.focus();
  }
});

$("newChat").onclick = () => {
  history = [];
  log.innerHTML = "";
  addMessage("Hello! I'm JARVIS. How can I help you?", "ai");
};

buildModes();
</script>
</body>
</html>
